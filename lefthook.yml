pre-commit:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx oxlint --deny-warnings {staged_files}
    format:
      glob: '*.{js,jsx,ts,tsx,json,css,md,html,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
